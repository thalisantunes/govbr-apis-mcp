- id: conecta-faixa-de-renda-de-grupo-familiar
  name: Faixa de Renda de Grupo Familiar
  provider: Instituto Nacional do Seguro Social (INSS)
  category: conecta
  status: requires_public_entity
  auth: oauth2_client_credentials
  docs_url: https://www.gov.br/conecta/catalogo/apis/faixa-de-renda-de-grupo-familiar
  description: Utilizando como base as informações contidas no Cadastro Nacional de Informações Sociais
    - CNIS, a API Faixa de Renda de Grupo Familiar tem como finalidade classificar a renda média de um
    grupo familiar especificado por uma lista de, no mínimo, dois CPFs. A API calcula a renda média mensal
    familiar, em salários-mínimos, a partir de uma lista contendo o CPF do requerente principal e das
    pessoas que compõem o grupo familiar dele. A apuração da renda média mensal familiar também considera
    o período retroativo de doze meses a partir do mês imediatamente anterior ao mês informado no parâmetro
    competência. Ela classifica então o resultado obtido em faixas pré-estabelecidas¹, retornando o grupo
    de enquadramento do CPF do requerente principal. A API valida também se o valor declarado de renda,
    informado como parâmetro de entrada, é menor, igual, ou maior que o valor de renda média familiar
    calculado pela API².
  tags:
  - federal
  notes: 'Requires adhesion to Conecta gov.br as a public-sector entity. Gateway: https://apigateway.conectagov.estaleiro.serpro.gov.br
    (per-API path; see docs_url for the adhesion process and Swagger).'
