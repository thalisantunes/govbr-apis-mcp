  docs_url: https://www.gov.br/conecta/catalogo/apis/api-de-servicos
  description: 'O Registro de Referência do Portal de Serviços Públicos foi instituído pela Resolução
    nº 9, de 22 de junho de 2022 do CCGD (Comitê Central de Governança de Dados), e tem a finalidade de:
    promover a interoperabilidade do conjunto de dados entre entes governamentais; auxiliar a formulação,
    a implementação, a avaliação, o monitoramento e a gestão de políticas públicas; fomentar a qualidade
    e a fidedignidade dos dados custodiados pelos órgãos gestores de dados; aumentar a eficiência e reduzir
    custos das operações internas dos sistemas de informação dos órgãos gestores e consumidores de dados;
    e orientar o acesso aos órgãos e entidades de que trata o art. 1º ao conjunto de dados relacionados
    à Application Programming Interface - API do Portal de Serviços Públicos - API de Serviços, que compreende
    o canal oficial do Governo federal para divulgação das informações sobre os serviços públicos federais,
    em atendimento às finalidades previstas nos incisos I a VI do art. 1º do Decreto nº 8.936, de 19 de
    dezembro de 2016.'
  tags:
  - federal
  notes: 'Requires adhesion to Conecta gov.br as a public-sector entity. Gateway: https://apigateway.conectagov.estaleiro.serpro.gov.br
    (per-API path; see docs_url for the adhesion process and Swagger).'
