[project]
name = "govbr-apis-mcp"
version = "0.1.0"
description = "MCP server exposing Brazilian government APIs (public, Serpro commercial and Conecta gov.br) through a spec-driven gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thalis Antunes" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.17,<0.18",
]

[project.urls]
Homepage = "https://github.com/thalisantunes/govbr-apis-mcp"
Repository = "https://github.com/thalisantunes/govbr-apis-mcp"
Issues = "https://github.com/thalisantunes/govbr-apis-mcp/issues"

[project.scripts]
govbr-apis-mcp = "govbr_apis_mcp.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
govbr_apis_mcp = ["catalog_data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
